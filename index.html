<!-- Standalone Local Copy of Moving Waveform Visualizer -->
<!-- Double-click this file or open in Chrome / Edge / Firefox to run -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moving Waveform Visualizer - BPSK, Gray QPSK & DBPSK</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    input[type=range] {
      accent-color: var(--primary, #3b82f6);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased p-3 sm:p-6 font-sans min-h-screen flex flex-col justify-center">
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-2xl max-w-5xl mx-auto space-y-5 w-full">
    
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-4">
      <div>
        <h2 class="text-xl sm:text-2xl font-bold tracking-tight text-white flex items-center gap-2">
          <span class="inline-block w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
          Live Modulation & Waveform Visualizer
        </h2>
        <p class="text-xs sm:text-sm text-slate-400 mt-0.5">
          First-principles real-time RF carrier, I/Q baseband, and Constellation dynamics under phase offset
        </p>
      </div>
      <!-- Play / Pause & New Bits -->
      <div class="flex items-center gap-2">
        <button id="btnPlayPause" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-semibold hover:bg-blue-500 transition shadow">
          ⏸ Pause
        </button>
        <button id="btnNewBits" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-semibold hover:bg-slate-700 transition">
          🎲 Random Bits
        </button>
      </div>
